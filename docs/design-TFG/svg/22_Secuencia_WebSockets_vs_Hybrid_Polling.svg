t x="1359.411" y="705.516" width="172.3" height="30.297" fill="#ECF0F1" style="stroke:#2C3E50;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1366.411" y="725.511" fill="#000" font-size="14" textLength="158.3">Servidor Spring Boot 3</text><rect x="10" y="127.293" width="1570.651" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="127.293" x2="1580.651" y2="127.293" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="130.293" x2="1580.651" y2="130.293" style="stroke:#000;stroke-width:1;"/><rect x="545.344" y="116.727" width="499.964" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="551.344" y="132.793" fill="#000" font-size="13" textLength="481.438" font-weight="700">1. Evento de Negocio: Modificación de Estado (ej. Nuevo Jugador)</text><line x1="661.336" y1="170.992" x2="702.336" y2="170.992" style="stroke:#2C3E50;stroke-width:1;"/><line x1="661.336" y1="170.992" x2="661.336" y2="183.992" style="stroke:#2C3E50;stroke-width:1;"/><line x1="661.336" y1="183.992" x2="701.336" y2="183.992" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="691.336,179.992,701.336,183.992,691.336,187.992,695.336,183.992" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="431.396" y="165.926" fill="#000" font-size="13" font-weight="700">1</text><text x="444.442" y="165.926" fill="#000" font-size="13" textLength="251.894">Jugador se une a la sala (createPlayer)</text><line x1="1403.561" y1="213.125" x2="1444.561" y2="213.125" style="stroke:#2C3E50;stroke-width:1;"/><line x1="1403.561" y1="213.125" x2="1403.561" y2="226.125" style="stroke:#2C3E50;stroke-width:1;"/><line x1="1403.561" y1="226.125" x2="1443.561" y2="226.125" style="stroke:#2C3E50;stroke-width:1;"/><polygon points="1433.561,222.125,1443.561,226.125,1433.561,230.125,1437.561,226.125" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1173.621" y="208.059" fill="#000" font-size="13" font-weight="700">2</text><text x="1186.667" y="208.059" fill="#000" font-size="13" textLength="251.894">Jugador se une a la sala (createPlayer)</text><rect x="10" y="254.691" width="1570.651" height="3" fill="#EEE" style="stroke:#EEE;stroke-width:1;"/><line x1="10" y1="254.691" x2="1580.651" y2="254.691" style="stroke:#000;stroke-width:1;"/><line x1="10" y1="257.691" x2="1580.651" y2="257.691" style="stroke:#000;stroke-width:1;"/><rect x="644.856" y="244.125" width="300.939" height="23.133" fill="#EEE" style="stroke:#000;stroke-width:2;"/><text x="650.856" y="260.192" fill="#000" font-size="13" textLength="282.414" font-weight="700">2. Entrega y Sincronización del Evento</text><polygon points="217.639,294.391,207.639,298.391,217.639,302.391,213.639,298.391" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="211.639" y1="298.391" x2="702.336" y2="298.391" style="stroke:#2C3E50;stroke-width:1;"/><text x="267.957" y="293.325" fill="#000" font-size="13" font-weight="700">3</text><text x="281.002" y="293.325" fill="#000" font-size="13" textLength="361.017">Frame STOMP en /topic/refresh (Señal de evento vacía)</text><path d="M52.917,311.391 L52.917,366.391 L359.917,366.391 L359.917,321.391 L349.917,311.391 L52.917,311.391" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M349.917,311.391 L349.917,321.391 L359.917,321.391 L349.917,311.391" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="58.917" y="328.458" fill="#000" font-size="13" textLength="221.222">El cliente recibe la señal de aviso,</text><text x="58.917" y="343.59" fill="#000" font-size="13" textLength="286.444">pero carece de los datos del nuevo jugador.</text><text x="58.917" y="358.723" fill="#000" font-size="13" textLength="260.152">Dispara fetchPlayers() inmediatamente.</text><polygon points="686.336,388.922,696.336,392.922,686.336,396.922,690.336,392.922" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="206.639" y1="392.922" x2="692.336" y2="392.922" style="stroke:#2C3E50;stroke-width:1;"/><text x="218.639" y="387.856" fill="#000" font-size="13" font-weight="700">4</text><text x="231.685" y="387.856" fill="#000" font-size="13" textLength="454.651">GET /api/v1/matches/{matchId}/players (Petición HTTP Pull adicional)</text><polygon points="217.639,418.055,207.639,422.055,217.639,426.055,213.639,422.055" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="211.639" y1="422.055" x2="697.336" y2="422.055" style="stroke:#2C3E50;stroke-width:1;stroke-dasharray:2,2;"/><text x="389.677" y="416.989" fill="#000" font-size="13" font-weight="700">5</text><text x="402.722" y="416.989" fill="#000" font-size="13" textLength="112.576">200 OK [Player[]]</text><path d="M130.307,435.055 L130.307,490.055 L779.307,490.055 L779.307,445.055 L769.307,435.055 L130.307,435.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M769.307,435.055 L769.307,445.055 L779.307,445.055 L769.307,435.055" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="198.016" y="452.122" fill="#000" font-size="13" textLength="285.759">Sobrecarga del patrón híbrido Signal + Pull:</text><text x="198.016" y="467.254" fill="#000" font-size="13" textLength="504.943">2 intercambios de red por evento (notificación WS + llamada REST síncrona).</text><text x="198.016" y="482.387" fill="#000" font-size="13" textLength="454.981">Multiplicado concurrentemente por cada cliente conectado en la sala.</text><polygon points="1076.19,552.719,1066.19,556.719,1076.19,560.719,1072.19,556.719" fill="#2C3E50" style="stroke:#2C3E50;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="1070.19" y1="556.719" x2="1444.561" y2="556.719" style="stroke:#2C3E50;stroke-width:1;"/><text x="1077.19" y="544.086" fill="#000" font-size="13" font-weight="700">6</text><text x="1090.235" y="536.52" fill="#000" font-size="13" textLength="343.326">Frame STOMP en /topic/match/newPlayer/{matchId}</text><text x="1131.99" y="551.653" fill="#000" font-size="13" textLength="259.816">[Payload consolidado: LobbyPlayerDTO]</text><path d="M946.357,569.719 L946.357,624.719 L1183.357,624.719 L1183.357,579.719 L1173.357,569.719 L946.357,569.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1173.357,569.719 L1173.357,579.719 L1183.357,579.719 L1173.357,569.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="952.357" y="586.786" fill="#000" font-size="13" textLength="189.617">El cliente procesa y actualiza</text><text x="952.357" y="601.918" fill="#000" font-size="13" textLength="216.665">el estado en una única operación</text><text x="952.357" y="617.051" fill="#000" font-size="13" textLength="208.006">sin consultas HTTP intermedias.</text><path d="M986.426,635.117 L986.426,690.117 L1523.426,690.117 L1523.426,645.117 L1513.426,635.117 L986.426,635.117" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1513.426,635.117 L1513.426,645.117 L1523.426,645.117 L1513.426,635.117" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="1027.396" y="652.184" fill="#000" font-size="13" textLength="295.242">Ventaja del patrón Server Push de Upstream:</text><text x="1027.396" y="667.317" fill="#000" font-size="13" textLength="446.958">1 único envío de red unidireccional con el DTO completo serializado.</text><text x="1027.396" y="682.45" fill="#000" font-size="13" textLength="173.132">0 peticiones HTTP satélite.</text><?plantuml-src ZLLDRnit4BtlhnWu5mbrz64ZG2lK1HnxvIQrBI5IsuFhmuWxakbmoGt9bUF6-K4v-13qrgl-M8TShRHgtC8w2Alb3EVDUsz6M7gZotn6Dd7lfIxGOWxk1ZDp9_K2vgWSDK_eGqbQ47nAW3zZj5uAMQ3sOyooa77GYoSNv1mkw5Z9XGP1sdE1yFxOMdDtOfInyEBWv31zLOMVopcTIqslZSt8VdlUAFIS41Jl5zQKEbk7fIV3th2VV4uIBxqYZlNMQ7AG4KmjQbSOwmb8mrHINXXuHwW6SAmzt-VjwYyD4su45Nm7ur8fQ8sjyOPF3RpHN1LL6vQEpzmD2AEvmBqocC6fj2IyWTPqUDPEafdv27lVf4BhTDnl_q-vFNWn70