# Project identification
sonar.projectKey=Upstream_Board_Game-frontend
sonar.projectName=Upstream-Board-Game-frontend
sonar.organization=tfg-upstream
sonar.host.url=https://sonarcloud.io

# Performance
sonar.javascript.node.maxspace=4096

# Tests and source code differentiation
# Where the files are
sonar.sources=src
sonar.tests=src

# Let Sonar know which are the tests inside src folder
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx

sonar.sourceEncoding=UTF-8

# --- GLOBAL EXCLUSIONS ---
# Ignore completely
sonar.exclusions=node_modules/**,coverage/**,dist/**,build/**,public/**,**/*.txt,**/*.ttf,**/*.woff,**/*.woff2, **/*.eot,src/static/fonts/**

# --- COVERAGE ---
# Where to read results
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files to be analized without counting for coverage.
sonar.coverage.exclusions=**/*.css,**/*.config.*,**/types/*,src/main.tsx,**/*.json,**/*.md,**/*.d.ts,src/vite-env.d.ts