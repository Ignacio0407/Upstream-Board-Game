# Project key, must be unique in a given SonarCloud organization
sonar.projectKey=es.us.dp1:l4-01-2425-l4-01-frontend

# My organization
sonar.organization=tfg-upstream

# SonarCloud URL
sonar.host.url=https://sonarcloud.io

# Folder where your frontend source code is located
sonar.sources=src

# (Optional) Folders to be ignored in the analysis, as dependencies or tests
sonar.exclusions=node_modules/**, **/*.spec.ts, **/*.test.js

# Test Coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Files to ignore in the calculation of coverage %
sonar.coverage.exclusions=**/*.css,**/*.config.*,**/types/*,src/main.tsx,**/*.json,**/*.md,**/*.txt,**/*.d.ts,**/*.test.tsx,**/*.test.ts,src/vite-env.d.ts