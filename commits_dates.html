        const listContainer = document.getElementById('commit-list');
        const countContainer = document.getElementById('total-count');

        const lines = rawData.trim().split('\n');
        countContainer.textContent = lines.length;

        function formatMessage(message) {
            // Regex corregida para Conventional Commits
            const ccRegex = /^([a-zA-Z-]+)(?:\([\w-]+\))?!?:\s*(.*)/;
            const match = message.match(ccRegex);
            
            if (match) {
                const prefix = match[1] + ':';
                const rest = match[2];
                return `<span class="commit-prefix">${prefix}</span>${rest}`;
            }
            return message;
        }

        lines.forEach(line => {
            const parts = line.split('|');
            if (parts.length < 3) return;
            
            const hash = parts[0];
            const date = parts[1];
            const message = parts.slice(2).join('|');

            const li = document.createElement('li');
            li.className = 'commit-item';

            li.innerHTML = `
                <div class="commit-info">
                    <span class="commit-message">${formatMessage(message)}</span>
                    <div class="commit-meta">
                        <span class="date-text">${date}</span>
                    </div>
                </div>
                <div class="commit-hash-container">
                    <span class="commit-hash">${hash}</span>
                </div>
            `;
            listContainer.appendChild(li);
        });
